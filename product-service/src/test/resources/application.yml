# Test-only overrides. This file replaces src/main/resources/application.yml on
# the test classpath (it is not merged with it), so the config server import and
# the Postgres datasource are both absent here by design: contextLoads should
# verify the Spring wiring without needing a live config server or database.
spring:
  cloud:
    config:
      enabled: false

  datasource:
    url: jdbc:h2:mem:product_db;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
