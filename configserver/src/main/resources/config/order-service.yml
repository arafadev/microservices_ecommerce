spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  # Messaging broker: Kafka is active. To use RabbitMQ instead, uncomment this block and the
  # "rabbit" block below, comment "kafka", and swap the binder dependency in order-service/pom.xml.
  # rabbitmq:
  #   host: ${RABBITMQ_HOST:localhost}
  #   port: ${RABBITMQ_PORT:5672}
  #   username: ${RABBITMQ_USERNAME:guest}
  #   password: ${RABBITMQ_PASSWORD:guest}
  #   virtual-host: ${RABBITMQ_VHOST:/}
  #   connection-timeout: 30000

  # Spring Cloud Stream: OrderService publishes OrderCreatedEvent through StreamBridge to "createOrder-out-0"
  cloud:
    stream:
      bindings:
        createOrder-out-0:
          destination: order.exchange          # RabbitMQ: the exchange (Kafka: the topic name)
          content-type: application/json
      # Kafka binder
      kafka:
        binder:
          brokers: localhost:9092
      # RabbitMQ only: the routing key every message carries (Kafka has no routing keys)
      # rabbit:
      #   bindings:
      #     createOrder-out-0:
      #       producer:
      #         # a SpEL expression, so the literal must be in single quotes inside the double quotes
      #         routing-key-expression: "'order.tracking'"
  jpa:
    database: POSTGRESQL
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

  tracing:
    sampling:
      probability: 1.0

app:
  message: "Hello Order!"

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true


logging:
  file:
    name: logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 5MB
      max-history: 7

# Circuit Breaker
resilience4j:
  circuitbreaker:
    instances:
      productService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        automaticTransitionFromOpenToHalfOpenEnabled: true
        slidingWindowType: count_based
  retry:
    instances:
      retryBreaker:
        maxAttempts: 5
        waitDuration: 5s
  ratelimiter:
    instances:
      rateBreaker:
        timeout-duration: 0
        limit-refresh-period: 4s
        limit-for-period: 2