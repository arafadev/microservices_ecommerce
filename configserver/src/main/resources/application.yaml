spring:
  application:
    name: configserver
  profiles:
    active: native
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 30000
  cloud:
    config:
      server:
        native:
          # Relative to where the app is started. Works from configserver/ (./mvnw spring-boot:run)
          # and from the repo root (IDE). Override with SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS.
          search-locations: file:./src/main/resources/config/,file:./configserver/src/main/resources/config/

server:
  port: 8888

management:
  endpoints:
    web:
      exposure:
        include: "*"