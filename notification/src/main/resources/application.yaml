spring:
  application:
    name: notification
  # Messaging broker: Kafka is active. To use RabbitMQ instead, uncomment this block and the
  # "rabbit" block below, comment "kafka", and swap the binder dependency in pom.xml.
  # rabbitmq:
  #   host: ${RABBITMQ_HOST:localhost}
  #   port: ${RABBITMQ_PORT:5672}
  #   username: ${RABBITMQ_USERNAME:guest}
  #   password: ${RABBITMQ_PASSWORD:guest}
  #   virtual-host: ${RABBITMQ_VHOST:/}
  #   connection-timeout: 30000

  # Spring Cloud Function + Spring Cloud Stream
  cloud:
    function:
      definition: orderCreated            # the Consumer<OrderCreatedEvent> bean in OrderEventConsumer
    stream:
      function:
        definition: orderCreated
      bindings:
        orderCreated-in-0:
          destination: order.exchange     # RabbitMQ: the exchange (Kafka: the topic name)
          group: notification-group       # RabbitMQ: queue "order.exchange.notification-group" (Kafka: the consumer group)
      # Kafka binder
      kafka:
        binder:
          brokers: localhost:9092
      # RabbitMQ only: bind the queue with the "order.tracking" routing key.
      # Without it Stream binds with "#" (every routing key). Kafka has no routing keys.
      # rabbit:
      #   bindings:
      #     orderCreated-in-0:
      #       consumer:
      #         binding-routing-key: order.tracking

server:
  port: 8084

