spring:
  application:
    name: notification
  # Studying Kafka (ep 298): not used. To go back to RabbitMQ, uncomment this block
  # and the "rabbit" block below, and comment "kafka".
  # rabbitmq:
  #   host: ${RABBITMQ_HOST:localhost}
  #   port: ${RABBITMQ_PORT:5672}
  #   username: ${RABBITMQ_USERNAME:guest}
  #   password: ${RABBITMQ_PASSWORD:guest}
  #   virtual-host: ${RABBITMQ_VHOST:/}
  #   connection-timeout: 30000

  # ep 292: Spring Cloud Function + Spring Cloud Stream
  cloud:
    function:
      definition: orderCreated            # the Consumer<OrderCreatedEvent> bean in OrderEventConsumer
    stream:
      function:
        definition: orderCreated
      bindings:
        orderCreated-in-0:
          destination: order.exchange     # RabbitMQ: the exchange (Kafka: the topic name)
          group: notification-group       # RabbitMQ: queue "order.exchange.notification-group" (Kafka: the consumer group)
      # ep 298: Kafka binder (where Kafka is)
      kafka:
        binder:
          brokers: localhost:9092
      # RabbitMQ only: bind the queue with "order.tracking" like ep 6 did.
      # Without it Stream binds with "#" (every routing key). Kafka has no routing keys.
      # rabbit:
      #   bindings:
      #     orderCreated-in-0:
      #       consumer:
      #         binding-routing-key: order.tracking

server:
  port: 8084

# ep 294/298: was used by RabbitMqConfiguration and @RabbitListener, both gone now
