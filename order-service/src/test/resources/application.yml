spring:
  application:
    name: order-service

  # Tests must not depend on a running config server
  cloud:
    config:
      enabled: false

  datasource:
    url: jdbc:h2:mem:order_db;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
