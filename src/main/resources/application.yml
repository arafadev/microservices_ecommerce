  spring:
    application:
      name: ecom-application

    datasource:
      url: jdbc:postgresql://localhost:5432/ecommerce
      username: postgres
      password: root
      driver-class-name: org.postgresql.Driver

    jpa:
      database: POSTGRESQL
      show-sql: true
      hibernate:
        ddl-auto: update
      database-platform: org.hibernate.dialect.PostgreSQLDialect

  management:
    endpoints:
      web:
        exposure:
          include: "*"

    endpoint:
      health:
        show-details: always

    info:
      env:
        enabled: true

  info:
    app:
      name: MyNewApp
      description: App built by us
      version: 1.0.0
